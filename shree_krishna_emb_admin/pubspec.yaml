name: shree_krishna_emb_admin
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Shared Core Package (models, entities, errors)
  shree_krishna_core:
    path: ../core

  # Firebase
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1
  firebase_auth: ^6.5.1
  firebase_storage: ^13.4.1

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^9.2.1

  # HTTP & Networking (for future migration)
  http: ^1.6.0
  dio: ^5.9.2

  # JSON serialization
  json_annotation: ^4.11.0

  # UI
  cupertino_icons: ^1.0.9

  # Caching & Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5

  # Shared Design System
  shree_krishna_design_system:
    path: ../design_system

  # Design System Components
  image_picker: ^1.2.2
  # Drag-and-drop image upload (web + desktop) for the Media Library
  desktop_drop: ^0.5.0
  loading_animation_widget: ^1.3.0
  shimmer: ^3.0.0
  connectivity_plus: ^7.1.1

  # Localization
  intl: ^0.20.2

  # Additional utilities
  equatable: ^2.0.8
  uuid: ^4.5.3

  # Animations
  animate_do: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
