<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Shree Krishna Embroidery admin console"
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Shree Krishna Admin" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon (uses the admin app icon so the browser tab shows the logo) -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/Icon-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="icons/Icon-512.png"
    />
    <link rel="shortcut icon" type="image/png" href="icons/Icon-192.png" />

    <title>Shree Krishna Admin</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto Oxygen",
          "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",
          sans-serif;
        overflow: hidden;
      }

      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          180deg,
          #6b5a4a 0%,
          #5a4a3a 50%,
          #4a3a2a 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }

      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .splash-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* Decorative background circles */
      .splash-circle {
        position: absolute;
        border-radius: 50%;
        opacity: 0.08;
      }

      .splash-circle-1 {
        width: 350px;
        height: 350px;
        background: rgba(255, 153, 51, 0.12);
        top: -80px;
        right: -120px;
      }

      .splash-circle-2 {
        width: 300px;
        height: 300px;
        background: rgba(100, 150, 200, 0.08);
        bottom: -50px;
        left: -80px;
      }

      /* Content */
      .splash-content {
        text-align: center;
        z-index: 10;
        animation: fadeInUp 0.8s ease-out;
      }

      /* Logo */
      .splash-logo {
        width: 140px;
        height: 140px;
        margin: 0 auto 40px;
        border-radius: 50%;
        background: rgba(255, 153, 51, 0.15);
        border: 2.5px solid rgba(255, 153, 51, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 30px rgba(255, 153, 51, 0.2);
        animation: zoomIn 0.8s ease-out;
      }

      .splash-logo-icon {
        width: 70px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 65px;
      }

      /* Text */
      .splash-welcome {
        font-size: 14px;
        color: rgba(255, 153, 51, 0.8);
        margin-bottom: 4px;
        letter-spacing: 1px;
        font-weight: 400;
        animation: fadeInUp 0.8s ease-out 0.15s both;
      }

      .splash-title {
        font-size: 36px;
        font-weight: 900;
        color: #ffffff;
        margin-bottom: 16px;
        letter-spacing: 2px;
        text-shadow: 0 4px 12px rgba(255, 153, 51, 0.25);
        animation: fadeInUp 0.8s ease-out 0.25s both;
      }

      .splash-subtitle {
        font-size: 15px;
        color: rgba(255, 153, 51, 0.85);
        margin-bottom: 24px;
        letter-spacing: 0.8px;
        font-weight: 500;
        animation: fadeInUp 0.8s ease-out 0.4s both;
      }

      .splash-tagline {
        font-size: 13px;
        color: rgba(255, 153, 51, 0.65);
        max-width: 380px;
        line-height: 1.6;
        animation: fadeInUp 0.8s ease-out 0.55s both;
        word-spacing: 0.05em;
      }

      /* Loading indicator */
      .splash-loader {
        margin-top: 40px;
        animation: fadeInUp 0.8s ease-out 0.7s both;
      }

      .loader-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 153, 51, 0.5);
        margin: 0 5px;
        animation: pulse 1.5s infinite;
      }

      .loader-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loader-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes zoomIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      /* Responsive */
      @media (max-width: 768px) {
        .splash-welcome {
          font-size: 12px;
        }

        .splash-title {
          font-size: 28px;
          letter-spacing: 1.5px;
        }

        .splash-subtitle {
          font-size: 13px;
        }

        .splash-tagline {
          font-size: 12px;
          max-width: 320px;
        }

        .splash-logo {
          width: 110px;
          height: 110px;
          margin: 0 auto 32px;
        }

        .splash-logo-icon {
          font-size: 55px;
        }

        .splash-loader {
          margin-top: 36px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div class="splash-container">
        <div class="splash-circle splash-circle-1"></div>
        <div class="splash-circle splash-circle-2"></div>

        <div class="splash-content">
          <div class="splash-logo">
            <div class="splash-logo-icon">🌸</div>
          </div>

          <p class="splash-welcome">Welcome to</p>
          <h1 class="splash-title">Shree Krishna Embroidery</h1>
          <p class="splash-subtitle">Manage Your Embroidery Empire</p>

          <div class="splash-loader">
            <span class="loader-dot"></span>
            <span class="loader-dot"></span>
            <span class="loader-dot"></span>
          </div>
        </div>
      </div>
    </div>

    <script src="flutter_bootstrap.js" async></script>

    <script>
      // Hide splash screen when Flutter app is ready
      window.addEventListener("load", function () {
        // Wait a bit for Flutter to fully initialize
        setTimeout(function () {
          const splashScreen = document.getElementById("splash-screen");
          if (splashScreen) {
            splashScreen.classList.add("hidden");
            // Remove from DOM after animation completes
            setTimeout(function () {
              splashScreen.remove();
            }, 500);
          }
        }, 500);
      });
    </script>
  </body>
</html>
