<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shree_krishna_emb_admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Shree Krishna Embroidery Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2c2e2a 0%, #1a1c19 50%, #0f1110 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Decorative background circles */
    .splash-circle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.05;
    }

    .splash-circle-1 {
      width: 300px;
      height: 300px;
      background: rgba(255, 153, 51, 0.15);
      top: -100px;
      right: -100px;
    }

    .splash-circle-2 {
      width: 250px;
      height: 250px;
      background: rgba(143, 167, 254, 0.08);
      bottom: -80px;
      left: -50px;
    }

    /* Content */
    .splash-content {
      text-align: center;
      z-index: 10;
      animation: fadeInUp 0.8s ease-out;
    }

    /* Logo */
    .splash-logo {
      width: 140px;
      height: 140px;
      margin: 0 auto 40px;
      border-radius: 50%;
      background: rgba(255, 153, 51, 0.15);
      border: 2.5px solid rgba(255, 153, 51, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 30px rgba(255, 153, 51, 0.3);
      animation: zoomIn 0.8s ease-out;
    }

    .splash-logo-icon {
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
    }

    /* Text */
    .splash-title {
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 2.5px;
      text-shadow: 0 4px 12px rgba(255, 153, 51, 0.3);
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .splash-subtitle {
      font-size: 16px;
      color: rgba(255, 153, 51, 0.9);
      margin-bottom: 32px;
      letter-spacing: 1.2px;
      font-weight: 500;
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    .splash-tagline {
      font-size: 14px;
      color: rgba(255, 153, 51, 0.7);
      max-width: 300px;
      line-height: 1.6;
      animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    /* Loading indicator */
    .splash-loader {
      margin-top: 48px;
      animation: fadeInUp 0.8s ease-out 0.8s both;
    }

    .loader-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 153, 51, 0.6);
      margin: 0 4px;
      animation: pulse 1.5s infinite;
    }

    .loader-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.6;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .splash-title {
        font-size: 24px;
      }

      .splash-subtitle {
        font-size: 14px;
      }

      .splash-tagline {
        font-size: 12px;
      }

      .splash-logo {
        width: 100px;
        height: 100px;
      }

      .splash-logo-icon {
        font-size: 50px;
      }
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-container">
      <div class="splash-circle splash-circle-1"></div>
      <div class="splash-circle splash-circle-2"></div>

      <div class="splash-content">
        <div class="splash-logo">
          <div class="splash-logo-icon">🌸</div>
        </div>

        <h1 class="splash-title">Shree Krishna Embroidery</h1>
        <p class="splash-subtitle">Manage Your Embroidery Empire</p>
        <p class="splash-tagline">Admin dashboard to manage designs, orders, and your embroidery business</p>

        <div class="splash-loader">
          <span class="loader-dot"></span>
          <span class="loader-dot"></span>
          <span class="loader-dot"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide splash screen when Flutter app is ready
    window.addEventListener('load', function() {
      // Wait a bit for Flutter to fully initialize
      setTimeout(function() {
        const splashScreen = document.getElementById('splash-screen');
        if (splashScreen) {
          splashScreen.classList.add('hidden');
          // Remove from DOM after animation completes
          setTimeout(function() {
            splashScreen.remove();
          }, 500);
        }
      }, 500);
    });
  </script>
</body>
</html>
