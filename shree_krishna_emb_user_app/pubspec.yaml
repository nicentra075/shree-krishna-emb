name: shree_krishna_emb
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Shared Core Package (models, entities, errors)
  shree_krishna_core:
    path: ../core

  # Firebase
  firebase_core: ^4.8.0
  cloud_firestore: ^6.4.0
  firebase_auth: ^6.5.0
  firebase_storage: ^13.4.0
  cloud_functions: ^6.0.0
  google_sign_in: ^7.2.0

  # Payments
  razorpay_flutter: ^1.4.0

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^9.2.1

  # HTTP & Networking (for future migration)
  http: ^1.6.0
  dio: ^5.9.2

  # JSON serialization
  json_annotation: ^4.11.0

  # UI Package
  flutter_ui_toolbox: ^0.0.6

  # Animations & UI
  animate_do: ^5.1.0
  smooth_page_indicator: ^2.0.1

  # Caching & Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5

  # Shared Design System
  shree_krishna_design_system:
    path: ../design_system

  # Design System Components
  image_picker: ^1.2.2
  # Open / download purchased design files (opens the Storage URL in the browser)
  url_launcher: ^6.3.1
  loading_animation_widget: ^1.3.0
  shimmer: ^3.0.0
  connectivity_plus: ^7.1.1

  # Localization
  intl: ^0.20.2

  # Additional utilities
  equatable: ^2.0.8
  uuid: ^4.5.3
  screen_protector: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
