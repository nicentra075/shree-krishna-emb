name: shree_krishna_emb
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Shared Core Package (models, entities, errors)
  shree_krishna_core:
    path: ../core

  # Firebase
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  firebase_storage: ^13.3.0
  google_sign_in: ^6.2.1

  # State Management
  flutter_bloc: ^8.1.4
  bloc: ^8.1.2
  get_it: ^7.6.0

  # HTTP & Networking (for future migration)
  http: ^1.1.0
  dio: ^5.3.1

  # JSON serialization
  json_annotation: ^4.8.1

  # UI Package
  flutter_ui_toolbox: ^0.0.6

  # Animations & UI
  animate_do: ^3.1.2
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.2.0

  # Caching & Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # Shared Design System
  shree_krishna_design_system:
    path: ../design_system

  # Design System Components
  image_picker: ^1.1.2
  loading_animation_widget: ^1.3.0
  shimmer: ^3.0.0
  connectivity_plus: ^7.0.0

  # Localization
  intl: ^0.20.2

  # Additional utilities
  equatable: ^2.0.5
  uuid: ^4.0.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
