name: shree_krishna_core
description: "Shared models, entities, and core utilities for Shree Krishna Embroidery apps (Admin + User)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Core utilities
  equatable: ^2.0.5
  uuid: ^4.0.0
  intl: ^0.20.2

  # Shared theme state (ThemeCubit)
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
